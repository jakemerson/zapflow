<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Crisp white lightning symbol -->
  <path d="M35 12L19 34H31L27 52L45 30H33L35 12Z" fill="#ffffff" filter="url(#shadow)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
